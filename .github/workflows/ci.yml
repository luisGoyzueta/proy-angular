
name: Angular Full Stack CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  # ======================================
  # 1. FRONTEND - ANGULAR
  # ======================================

  frontend:
    name: Angular - Tests y Build
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias Angular
        run: npm ci

      - name: Ejecutar pruebas Angular
        run: npm run test:ci

      - name: Compilar Angular
        run: npm run build:prod

      - name: Guardar build
        uses: actions/upload-artifact@v4
        with:
          name: angular-production-build
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ======================================
  # 2. BACKEND - EXPRESS + SQLITE
  # ======================================

  backend:
    name: Express - Tests de Integración
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: proyecto-api

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: proyecto-api/package-lock.json

      - name: Instalar dependencias Express
        run: npm ci

      - name: Ejecutar pruebas backend
        run: npm test

  # ======================================
  # 3. E2E - PLAYWRIGHT
  # ======================================

  e2e:
    name: Playwright - E2E y Accesibilidad
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend

    env:
      DATABASE_PATH: /tmp/proyecto-angular-e2e.sqlite
      FRONTEND_URL: http://localhost:4200
      E2E_EMAIL: admin-e2e@example.test
      E2E_PASSWORD: E2E-Test-Password-2026!

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            proyecto-api/package-lock.json

      - name: Instalar dependencias Angular
        run: npm ci

      - name: Instalar dependencias Express
        working-directory: proyecto-api
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Crear cuenta de pruebas E2E
        working-directory: proyecto-api
        run: npx tsx src/tests/seed-e2e.ts

      - name: Iniciar API Express
        working-directory: proyecto-api
        run: |
          npm run dev > /tmp/express-e2e.log 2>&1 &
          echo $! > /tmp/express-e2e.pid

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:3000/api/health > /dev/null; then
              echo "API Express disponible"
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: API Express no disponible"
          cat /tmp/express-e2e.log
          exit 1

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Guardar logs de Express
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: express-e2e-logs
          path: /tmp/express-e2e.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Guardar informe Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
