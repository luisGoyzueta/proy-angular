<header class="header">
  <div class="header-left">
    <p-button
      icon="pi pi-bars"
      [text]="true"
      severity="secondary"
      ariaLabel="Abrir menú"
      styleClass="mobile-menu"
      (onClick)="menuClick.emit()"
    />
    <div>
      <h2>Panel administrativo</h2>
      <span>Bienvenido a tu espacio de trabajo</span>
    </div>
  </div>

  <div class="header-right">
    <p-avatar label="AD" shape="circle" size="large" />
    <div class="user-info">
      <strong>Administrador</strong>
      <span>Admin</span>
    </div>
    <button type="button" class="logout-button" (click)="logout()" aria-label="Cerrar sesión">
      <i class="pi pi-sign-out" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>
  </div>
</header>
