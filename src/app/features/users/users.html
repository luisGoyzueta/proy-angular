<section class="users-page">
  <!-- ENCABEZADO -->
  <div class="page-header">
    <div>
      <h1>Gestión de usuarios</h1>
      <p>Administra los usuarios registrados en el sistema</p>
    </div>
    @if (canCreate()) {
      <p-button
        data-testid="new-user-button"
        label="Nuevo usuario"
        icon="pi pi-plus"
        [disabled]="saving() || deleting()"
        (onClick)="openCreate()"
        styleClass="new-user-button"
      />
    }
  </div>

  <!-- TABLA -->
  <div class="table-card">
    <p-table
      [value]="filteredUsers()"
      [loading]="loading()"
      [paginator]="true"
      data-testid="users-table"
      [rows]="10"
      [rowsPerPageOptions]="[10, 20, 30]"
      [tableStyle]="{ 'min-width': '750px' }"
    >
      <!-- BUSCADOR -->
      <ng-template #caption>
        <div class="table-toolbar">
          <div class="search-container">
            <label for="search-users">Buscar usuario</label>
            <input
              id="search-users"
              pInputText
              type="search"
              [ngModel]="search()"
              (ngModelChange)="setSearch($event)"
              placeholder="Buscar usuario..."
            />
          </div>
        </div>
      </ng-template>

      <!-- CABECERA -->
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">
            Nombre
            <p-sortIcon field="name" />
          </th>
          <th pSortableColumn="email">
            Correo electrónico
            <p-sortIcon field="email" />
          </th>
          <th pSortableColumn="role">
            Rol
            <p-sortIcon field="role" />
          </th>
          <th pSortableColumn="status">
            Estado
            <p-sortIcon field="status" />
          </th>
          <th>Acciones</th>
        </tr>
      </ng-template>

      <!-- CONTENIDO -->
      <ng-template #body let-user>
        <tr>
          <td>
            <div class="user-name">
              <i class="pi pi-user" aria-hidden="true"></i>
              <span>{{ user.name }}</span>
            </div>
          </td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <p-tag
              [value]="user.status"
              [severity]="user.status === 'Activo' ? 'success' : 'danger'"
            />
          </td>
          <!-- BOTONES DE ACCIONES -->
          <td>
            <div class="actions">
              @if (canEdit()) {
                <p-button
                  icon="pi pi-pencil"
                  severity="info"
                  [text]="true"
                  [rounded]="true"
                  data-testid="edit-user-button"
                  ariaLabel="Editar usuario"
                  (onClick)="openEdit(user)"
                />
              }
              @if (canDelete()) {
                <p-button
                  data-testid="delete-user-button"
                  icon="pi pi-trash"
                  severity="danger"
                  [text]="true"
                  [rounded]="true"
                  [disabled]="deleting() !== null"
                  [loading]="deleting() === user.id"
                  ariaLabel="Eliminar usuario"
                  (onClick)="confirmDelete(user)"
                />
              }
            </div>
          </td>
        </tr>
      </ng-template>
      <!-- <ng-template #footer>
        <div class="users-summary">
          <div class="summary-card">
            <span>Total de usuarios</span>
            <strong>{{ totalUsers() }}</strong>
          </div>
          <div class="summary-card">
            <span>Usuarios activos</span>
            <strong>{{ activeUsers() }}</strong>
          </div>
        </div>
      </ng-template> -->

      <!-- SIN RESULTADOS -->
      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="empty-message">No se encontraron usuarios.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</section>

<!-- MODAL REGISTRAR / EDITAR -->
<app-user-form
  [visible]="dialogVisible()"
  [user]="selectedUser()"
  (visibleChange)="setDialogVisible($event)"
  (save)="saveUser($event)"
/>

<!-- CONFIRMACIÓN PARA ELIMINAR -->
<p-confirmDialog />

<!-- NOTIFICACIONES -->
<p-toast />
