<div class="backdrop" role="presentation" (keydown.escape)="attemptClose()" (click)="onBackdropClick($event)">
  <div
    class="modal-card"
    appFocusTrap
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-modal-title"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
  >
    <h2 id="edit-modal-title">Editar miembro del equipo</h2>

    <form (submit)="onSubmit($event)" novalidate>
      <div class="field">
        <label for="member-name">Nombre completo</label>
        <input
          id="member-name"
          type="text"
          aria-required="true"
          [value]="store.draft().name"
          (input)="onNameInput($event)"
          [attr.aria-invalid]="showNameError()"
          [attr.aria-describedby]="showNameError() ? 'name-error' : null"
        />
        @if (showNameError()) {
          <span id="name-error" class="error-text" role="alert">
            {{ store.nameError() }}
          </span>
        }
      </div>

      <div class="field">
        <label for="member-role">Rol</label>
        <select id="member-role" [value]="store.draft().role" (change)="onRoleChange($event)">
          <option value="Usuario">Usuario</option>
          <option value="Editor">Editor</option>
          <option value="Administrador">Administrador</option>
        </select>
      </div>

      @if (confirmDiscard()) {
        <div class="discard-banner" role="alert" aria-live="assertive">
          <p>Tienes cambios sin guardar. ¿Deseas descartarlos?</p>
          <div class="discard-actions">
            <button type="button" class="btn-ghost" (click)="confirmDiscard.set(false)">
              Seguir editando
            </button>
            <button type="button" class="btn-danger" (click)="closed.emit()">
              Descartar cambios
            </button>
          </div>
        </div>
      }

      <div class="actions">
        <button type="button" class="btn-secondary" (click)="attemptClose()">Cancelar</button>
        <button type="submit" class="btn-primary" [attr.aria-disabled]="!store.isValid()">
          Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
