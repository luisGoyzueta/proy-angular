<section class="curso-container">
  <div class="curso-card">
    <h2>Abrir Modal Inyectado</h2>
    <button
      #deleteTrigger
      type="button"
      (click)="modalService.open(deleteTrigger)"
      class="trigger-btn"
    >
      Eliminar elemento
    </button>
    <app-confirm-modal />
  </div>

  <div class="curso-card">
    <h2>Directiva Standalone de Focus Trap para Diálogos y Drawers</h2>
    <button #settingsTrigger type="button" (click)="openModal(settingsTrigger)" class="trigger-btn">
      Abrir Ajustes
    </button>

    @if (modalVisible()) {
      <app-settings-modal (closed)="closeModal()" />
    }
  </div>

  <div class="curso-card">
    <h2>Servicio de Diálogos Dinámicos con InjectionToken y Standalone</h2>
    <button #btnEdit type="button" (click)="openEdit(btnEdit)" class="trigger-btn">
      Editar datos de perfil
    </button>
  </div>
</section>
